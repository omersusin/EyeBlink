name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. No repository write is needed to build an APK.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level so every Gradle step sees them. The signing block in
    # app/build.gradle.kts reads these env vars; blank values mean "unsigned".
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v3 is unusable on current runners: it runs `sdkmanager tools`, and the
      # legacy "tools" package was removed from Google's repository, so it exits
      # 1 with "Failed to find package 'tools'". v4 drops that step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Must match compileSdk/targetSdk in app/build.gradle.kts.
      # setup-android already accepts the SDK licenses and puts sdkmanager on PATH.
      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Materialise the signing key from secrets. Nothing is committed to the
      # repo, and the file is removed at the end of the job. The guard lives in
      # the shell rather than in `if:` so the step is always defined and an
      # absent key simply leaves the release APK unsigned.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no keystore configured - release APK will be unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eyeblink-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/eyeblink-release.jks" >> "$GITHUB_ENV"

      # The platform-free brain: scheduling, the playback safety protocol, parsers, calibration math.
      - name: Core tests
        run: ./gradlew :core:test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug :lsposed:lintDebug --continue --stacktrace

      # Lint prints only its first failure on the console; the full report is what is needed to fix them all.
      - name: Show lint reports
        if: failure()
        run: |
          shopt -s nullglob
          for f in app/build/reports/lint-results-debug.txt lsposed/build/reports/lint-results-debug.txt \
                   app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; do
            echo "=== $f ==="; sed -n 1,220p "$f"
          done

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug :lsposed:assembleDebug --stacktrace

      # The privacy page promises that EyeBlink cannot reach the network. The manifest removes the
      # permission even if a library asks for it; this proves it on what was actually built.
      - name: Guard - no network permission
        run: |
          shopt -s nullglob
          for APK in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            if "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump permissions "$APK" | grep -qi "android.permission.INTERNET"; then
              echo "::error::$APK declares INTERNET"; exit 1
            fi
          done
          echo "no APK declares INTERNET"

      # Renders the real UI (the same Compose sources as the app) headlessly, so every change can be
      # looked at. Non-blocking: a rendering hiccup must never hide a real build result.
      - name: Render UI screenshots
        continue-on-error: true
        run: ./gradlew :tools:designlab:run --args="$GITHUB_WORKSPACE/build/shots" --stacktrace

# R8 + resource shrinking are enabled on release (see app/build.gradle.kts).
      # Signed only when the secrets above were present; otherwise Gradle emits
      # an unsigned release APK rather than failing.
      - name: Assemble release APKs
        run: ./gradlew :app:assembleRelease :lsposed:assembleRelease --stacktrace

      # App Bundle: what Play actually consumes. Play serves per-device, so the
      # bundle carries all ABIs while each install downloads only one slice.
      - name: Assemble release App Bundle
        run: ./gradlew :app:bundleRelease --stacktrace

      # apksigner is the source of truth. Do NOT look for META-INF/*.RSA:
      # at minSdk 26 AGP emits v2/v3 signatures only, which write an APK
      # Signing Block and no META-INF signature entries at all.
      - name: Verify release APKs
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "no release APK produced"; exit 1
          fi
          for APK in "${APKS[@]}"; do
            echo "=== $(basename "$APK") ($(du -h "$APK" | cut -f1)) ==="
            if "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"; then
              echo "  result: SIGNED and verified"
            else
              echo "  result: unsigned or unverifiable"
              if [ -n "$KEYSTORE_PASSWORD" ]; then
                echo "  secrets were configured, so this is a real error"
                exit 1
              fi
            fi
          done

      - name: Report artifact sizes
        run: |
          echo "release slices:"
          du -h app/build/outputs/apk/release/*.apk 2>/dev/null || true
          echo "app bundle:"
          du -h app/build/outputs/bundle/release/*.aab 2>/dev/null || true

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: eyeblink-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.idsig
            app/build/outputs/bundle/release/*.aab
            lsposed/build/outputs/apk/debug/*.apk
            lsposed/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v7
        with:
          name: eyeblink-ui
          path: build/shots/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/eyeblink-release.jks"
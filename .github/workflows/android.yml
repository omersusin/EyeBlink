name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. No repository write is needed to build an APK.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level so every Gradle step sees them. The signing block in
    # app/build.gradle.kts reads these env vars; blank values mean "unsigned".
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v3 is unusable on current runners: it runs `sdkmanager tools`, and the
      # legacy "tools" package was removed from Google's repository, so it exits
      # 1 with "Failed to find package 'tools'". v4 drops that step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Must match compileSdk/targetSdk in app/build.gradle.kts.
      # setup-android already accepts the SDK licenses and puts sdkmanager on PATH.
      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Materialise the signing key from secrets. Nothing is committed to the
      # repo, and the file is removed at the end of the job. Skipped entirely
      # when no key is configured, which leaves the release APK unsigned.
      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eyeblink-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/eyeblink-release.jks" >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # R8 + resource shrinking are enabled on release (see app/build.gradle.kts).
      # Signed only when the secrets above were present; otherwise Gradle emits
      # an unsigned release APK rather than failing.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Report release signing state
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            echo "release APK: $(du -h "$APK" | cut -f1)"
            if unzip -l "$APK" | grep -q "META-INF/.*\.\(RSA\|SF\|MF\)"; then
              echo "signature: PRESENT"
              "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose "$APK" || true
            else
              echo "signature: ABSENT (no signing secrets configured)"
            fi
          else
            echo "release APK missing"; exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: eyeblink-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/eyeblink-release.jks"
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repo. No secrets are needed to
# build an unsigned APK.
permissions:
  contents: read

# Cancel superseded runs on the same ref so pushes don't queue up builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # AGP 8.5 requires JDK 17; the project's source/target compatibility is 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v3 is unusable on current runners: it runs `sdkmanager tools`, and the
      # legacy "tools" package was removed from Google's repository, so it exits
      # 1 with "Failed to find package 'tools'". v4 drops that step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Must match compileSdk/targetSdk in app/build.gradle.kts.
      # setup-android already accepts the SDK licenses and puts sdkmanager on PATH.
      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Caches Gradle deps, the wrapper distribution and build outputs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned: no keystore is committed and signing is intentionally out of
      # scope for CI. Gradle still produces an APK you can side-load after
      # signing locally with apksigner.
      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: eyeblink-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
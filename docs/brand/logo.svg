<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EyeBlink">
  <title>EyeBlink</title>
  <!--
    The mark: an almond eye whose iris is lit from within, under a lid whose edge is a line of warm light.
    The geometry is the one in app/src/main/res/drawable/ic_launcher_foreground.xml, scaled by 512/108.
  -->
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="54" cy="54" r="34">
      <stop offset="0" stop-color="#52E6D2" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#14A9BC" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#14A9BC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" gradientUnits="userSpaceOnUse" cx="54" cy="54" r="14">
      <stop offset="0" stop-color="#9DF7EB"/>
      <stop offset="0.5" stop-color="#52E6D2"/>
      <stop offset="1" stop-color="#0E7F95"/>
    </radialGradient>
    <linearGradient id="seam" gradientUnits="userSpaceOnUse" x1="24" y1="54" x2="84" y2="54">
      <stop offset="0" stop-color="#FFBC70"/>
      <stop offset="0.5" stop-color="#FF6B8E"/>
      <stop offset="1" stop-color="#FFBC70"/>
    </linearGradient>
    <clipPath id="eye"><path d="M24,54 C38,36 70,36 84,54 C70,72 38,72 24,54 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="#000"/>
  <g transform="scale(4.740741)">
    <circle cx="54" cy="54" r="34" fill="url(#glow)"/>
    <path d="M24,54 C38,36 70,36 84,54 C70,72 38,72 24,54 Z" fill="#05080C"/>
    <g clip-path="url(#eye)">
      <circle cx="54" cy="54" r="14" fill="url(#iris)"/>
      <circle cx="54" cy="54" r="6.2" fill="#000"/>
      <circle cx="49.5" cy="49.6" r="2.2" fill="#fff" fill-opacity="0.9"/>
    </g>
    <path d="M24,54 C38,72 70,72 84,54" fill="none" stroke="#3FB8C6" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M24,54 C38,36 70,36 84,54" fill="none" stroke="url(#seam)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M34.3,45.4 L31.2,39.7 M43.8,41.7 L42,34.4 M54,40.5 L54,33 M64.2,41.7 L66,34.4 M73.7,45.4 L76.8,39.7" fill="none" stroke="#FFBC70" stroke-opacity="0.8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
